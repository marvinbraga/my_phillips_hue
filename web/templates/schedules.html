<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agendamentos - Marvin Hue</title>
    <link rel="icon" href="/static/favicon.png" type="image/png">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet"
          crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        .theme-toggle { position: fixed; top: 1rem; right: 1rem; z-index: 1000; }
        .theme-toggle .btn { border-radius: 50%; width: 48px; height: 48px; }
        .toast-container-fixed { position: fixed; bottom: 2rem; right: 2rem; z-index: 1100; }
        #schedules-empty { display: none; }
        .weekday-checks { display: flex; flex-wrap: wrap; gap: 0.5rem 1rem; }
    </style>
</head>
<body>
<div class="theme-toggle">
    <button id="theme-btn" class="btn btn-outline-secondary" type="button" title="Alternar tema">
        <i id="theme-icon" class="bi bi-moon-fill"></i>
    </button>
</div>

<div class="container mt-4">
    <nav aria-label="breadcrumb">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a href="/">Controle</a></li>
            <li class="breadcrumb-item"><a href="/groups">Grupos</a></li>
            <li class="breadcrumb-item active" aria-current="page">Agendamentos</li>
            <li class="breadcrumb-item"><a href="/mirror">Espelhamento</a></li>
        </ol>
    </nav>

    <h1><i class="bi bi-clock-history"></i> Agendamentos</h1>
    <p class="text-muted">Dispare ações no horário local (HH:MM) em dias da semana selecionados.</p>

    <div class="card mb-4">
        <div class="card-header d-flex justify-content-between align-items-center">
            <span><i class="bi bi-list-ul"></i> Agendas</span>
            <div class="d-flex gap-2">
                <button id="new-btn" type="button" class="btn btn-sm btn-primary">
                    <i class="bi bi-plus-lg"></i> Novo
                </button>
                <button id="refresh-btn" type="button" class="btn btn-sm btn-outline-secondary">
                    <i class="bi bi-arrow-clockwise"></i>
                </button>
            </div>
        </div>
        <div class="card-body p-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0" id="schedules-table">
                    <thead class="table-light">
                    <tr>
                        <th>Nome</th>
                        <th>Horário</th>
                        <th>Dias</th>
                        <th>Ação</th>
                        <th>Ativo</th>
                        <th class="text-end">Ações</th>
                    </tr>
                    </thead>
                    <tbody id="schedules-tbody"></tbody>
                </table>
            </div>
            <div id="schedules-empty" class="text-center text-muted py-5">
                Nenhum agendamento.
            </div>
            <div id="schedules-loading" class="text-center text-muted py-4">
                <div class="spinner-border spinner-border-sm me-2"></div> Carregando...
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="scheduleModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-scrollable">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="schedule-modal-title">Novo agendamento</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="schedule-id" value="">
                <div class="mb-3">
                    <label class="form-label" for="schedule-name">Nome</label>
                    <input type="text" class="form-control" id="schedule-name" maxlength="100">
                </div>
                <div class="mb-3">
                    <label class="form-label" for="schedule-time">Horário (HH:MM)</label>
                    <input type="time" class="form-control" id="schedule-time" value="08:00">
                </div>
                <div class="mb-3">
                    <label class="form-label">Dias da semana (vazio = todos)</label>
                    <div class="weekday-checks" id="weekday-checks">
                        <div class="form-check"><input class="form-check-input wd" type="checkbox" value="0" id="wd0"><label class="form-check-label" for="wd0">Seg</label></div>
                        <div class="form-check"><input class="form-check-input wd" type="checkbox" value="1" id="wd1"><label class="form-check-label" for="wd1">Ter</label></div>
                        <div class="form-check"><input class="form-check-input wd" type="checkbox" value="2" id="wd2"><label class="form-check-label" for="wd2">Qua</label></div>
                        <div class="form-check"><input class="form-check-input wd" type="checkbox" value="3" id="wd3"><label class="form-check-label" for="wd3">Qui</label></div>
                        <div class="form-check"><input class="form-check-input wd" type="checkbox" value="4" id="wd4"><label class="form-check-label" for="wd4">Sex</label></div>
                        <div class="form-check"><input class="form-check-input wd" type="checkbox" value="5" id="wd5"><label class="form-check-label" for="wd5">Sáb</label></div>
                        <div class="form-check"><input class="form-check-input wd" type="checkbox" value="6" id="wd6"><label class="form-check-label" for="wd6">Dom</label></div>
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label" for="schedule-action">Ação</label>
                    <select class="form-select" id="schedule-action">
                        <option value="apply_config">Aplicar configuração</option>
                        <option value="power_on">Ligar (todas ou grupo)</option>
                        <option value="power_off">Desligar (todas ou grupo)</option>
                        <option value="apply_group">Aplicar config em grupo</option>
                    </select>
                </div>
                <div class="mb-3" id="payload-config-wrap">
                    <label class="form-label" for="payload-config">Configuração</label>
                    <select class="form-select" id="payload-config"></select>
                </div>
                <div class="mb-3" id="payload-group-wrap">
                    <label class="form-label" for="payload-group">Grupo (opcional para power)</label>
                    <select class="form-select" id="payload-group">
                        <option value="">— nenhum —</option>
                    </select>
                </div>
                <div class="form-check form-switch">
                    <input class="form-check-input" type="checkbox" id="schedule-enabled" checked>
                    <label class="form-check-label" for="schedule-enabled">Ativo</label>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button type="button" class="btn btn-primary" id="schedule-save-btn">Salvar</button>
            </div>
        </div>
    </div>
</div>

<div class="toast-container-fixed">
    <div id="app-toast" class="toast align-items-center text-bg-success border-0" role="alert">
        <div class="d-flex">
            <div class="toast-body" id="app-toast-body"></div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"
        crossorigin="anonymous"></script>
<script src="/static/schedules.js"></script>
</body>
</html>
